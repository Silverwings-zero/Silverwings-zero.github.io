interests:
  summary: "How touch should be represented so that people can feel it and robots can learn from it. Right now that means language-driven haptic textures, touchable twins of scanned scenes, teleoperation with tactile feedback, and tactile representations for robot manipulation, grounded in measured materials in simulation."
  tags: ["Haptic rendering", "Tactile perception", "Robot learning", "Teleoperation", "HCI", "VR/AR"]

