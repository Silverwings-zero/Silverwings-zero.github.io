title: "Wanli (Michael) Qian"
author: "Wanli (Michael) Qian"
description: "Ph.D. student at USC building systems that let people and robots capture, generate, and feel touch."
url: "https://silverwings-zero.github.io"
permalink: /:title/
lang: "en"
excerpt_separator: "\n\n\n\n"
date_format: "%B %d, %Y"

# Profile, used by the header, hero, and footer

profile:
  greeting_name: "Michael"
  headline: "I make touch programmable."
  status: "Seeking a Summer 2027 research internship"
  photo: "/img/profile-image.jpg"
  photo_alt: "Portrait of Wanli (Michael) Qian in front of a graffiti wall"
  email: "wanliqia@usc.edu"
  location: "Los Angeles, CA"
  cv: "/assets/cv/Wanli_Qian_CV.pdf"
  scholar: "https://scholar.google.com/citations?user=azFoAIkAAAAJ&hl=en"
  github: "https://github.com/Silverwings-zero"
  linkedin: "https://www.linkedin.com/in/wanli-qian-7bb399192/"
  lab: "https://sites.usc.edu/culbertson/"

# Main menu. Links starting with "#" point to sections of the home page.

navigation:
  - {title: "Research", url: "#research"}
  - {title: "Publications", url: "#publications"}
  - {title: "About", url: "#about"}
  - {title: "Life", url: "#life"}

# Every post is a project page.

defaults:
  - scope: {path: "", type: "posts"}
    values: {layout: "post"}

# Leftover pages from the old theme that should not be published.

exclude:
  - README.md
  - Blog.html
  - aboutMe.md
  - Work.md
  - archive.html
  - Gemfile
  - Gemfile.lock
  - UNLICENSE.txt

plugins:
 - jekyll-feed
