{%- assign p = include.post -%}
<a class="work" href="{{ p.url | relative_url }}"{% if include.filterable %} data-topics="{{ p.topics | join: '|' }}"{% endif %}>
  {%- if p.image %}
  <img src="{{ p.image | relative_url }}" alt="" loading="lazy">
  {%- endif %}
  <div class="veil"></div>
  <div class="meta">
    <div class="chips">
      {%- if p.venue %}<span class="chip">{{ p.venue }}</span>{% endif -%}
      {%- if p.award %}<span class="chip chip-accent">{{ p.award }}</span>{% endif -%}
    </div>
    <h3>{{ p.card_title | default: p.title }}</h3>
    {%- if p.summary %}<p>{{ p.summary }}</p>{% endif %}
  </div>
</a>
